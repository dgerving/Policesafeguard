name: Build Android Release (Google Play Bundle)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allows one-click manual build in GitHub web interface

jobs:
  build-android:
    name: Build Android AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Android Platform
        run: npx cap sync android

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab for Google Play)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Build Standalone APK (.apk for Direct Testing)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: policeprotection-google-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload APK (.apk)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policeprotection-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
