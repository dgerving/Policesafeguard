<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  
  <!-- Outer Shield Border -->
  <path d="M256 56 C345 56 422 108 422 192 C422 322 300 422 256 456 C212 422 90 322 90 192 C90 108 167 56 256 56 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner Scale of Justice & Legal Shield Motif -->
  <!-- Center Column -->
  <rect x="251" y="140" width="10" height="200" rx="5" fill="url(#goldGrad)"/>
  
  <!-- Top Cross Beam -->
  <path d="M160 175 L352 175" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Center Crest / Star -->
  <circle cx="256" cy="175" r="14" fill="#fbbf24"/>
  <circle cx="256" cy="175" r="6" fill="#09090b"/>

  <!-- Left Scale Pan -->
  <path d="M180 175 L150 250 M180 175 L210 250" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 250 Q180 280 220 250 Z" fill="url(#goldGrad)"/>

  <!-- Right Scale Pan -->
  <path d="M332 175 L302 250 M332 175 L362 250" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round"/>
  <path d="M292 250 Q332 280 372 250 Z" fill="url(#goldGrad)"/>

  <!-- Verified Legal Badge Indicator at Bottom -->
  <circle cx="256" cy="370" r="32" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
  <path d="M244 370 L253 379 L270 361" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
